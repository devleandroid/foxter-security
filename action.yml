name: Git Symphony
description: Generate a MIDI, piano score, and interactive player from a repository's complete Git history.
author: devleandroid
inputs:
  output-directory:
    description: Directory inside the checked-out repository where the player files are generated.
    required: false
    default: site
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"
    - name: Install Git Symphony dependency
      shell: bash
      run: python -m pip install --disable-pip-version-check -r "$GITHUB_ACTION_PATH/requirements-git-symphony.txt"
    - name: Generate player and score
      shell: bash
      env:
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: python "$GITHUB_ACTION_PATH/scripts/git_symphony_action.py" --output-directory "$OUTPUT_DIRECTORY"
