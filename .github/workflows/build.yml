name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c "from pathlib import Path; import os; version = Path('VERSION').read_text(encoding='utf-8').strip(); tag = os.environ['TAG_NAME']; assert tag == f'v{version}', f'Tag {tag} must match VERSION ({version})'"
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit bandit
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run security lint
        run: python -m bandit -r core gui infra -ll

  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build compiled app
        run: python scripts/build_app.py
      - name: Create distributable archive
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python scripts/package_app.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FoxterSecurity-${{ matrix.target }}
          path: dist/FoxterSecurity-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Report artifact location
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python scripts/write_build_summary.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: FoxterSecurity-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: cd release-assets && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.zip release-assets/SHA256SUMS.txt --clobber
            gh release edit "$TAG_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" release-assets/*.zip release-assets/SHA256SUMS.txt --title "$TAG_NAME" --notes-file RELEASE_NOTES.md
          fi
          echo "Published packages to https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}" >> "$GITHUB_STEP_SUMMARY"
