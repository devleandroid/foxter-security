name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.14,<7"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone app
        run: python -m PyInstaller --noconfirm --clean Antivirus.spec
      - name: Create distributable archive
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python scripts/package_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: FoxterSecurity-${{ matrix.target }}
          path: dist/FoxterSecurity-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Report artifact location
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python scripts/write_build_summary.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FoxterSecurity-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.zip --clobber
            gh release edit "$TAG_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" release-assets/*.zip --title "$TAG_NAME" --notes-file RELEASE_NOTES.md
          fi
          echo "Published packages to https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}" >> "$GITHUB_STEP_SUMMARY"
